<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcSolver's Digital Museum & Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f1ea;
            --paper-color: #ffffff;
            --ink-color: #2b2b2b;
            --accent-red: #990000;
            --accent-blue: #003366;
            --border-color: #d1cbbd;
            --meta-color: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            font-family: 'IBM Plex Sans', sans-serif;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--paper-color);
            border: 2px solid var(--border-color);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.08);
            padding: 30px;
        }

        header {
            border-bottom: 3px double var(--ink-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 15px;
        }

        .archive-branding h1 {
            font-family: 'Special Elite', cursive;
            font-size: 2.2rem;
            color: var(--accent-red);
            letter-spacing: -1px;
        }

        .archive-branding p {
            font-family: 'Courier Prime', monospace;
            font-size: 0.9rem;
            color: var(--meta-color);
        }

        .header-links a {
            font-family: 'Courier Prime', monospace;
            background: var(--ink-color);
            color: #fff;
            padding: 8px 14px;
            text-decoration: none;
            font-size: 0.85rem;
            border-radius: 2px;
            transition: background 0.2s;
        }

        .header-links a:hover {
            background: var(--accent-blue);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-bar {
            flex: 1;
            min-width: 250px;
            padding: 10px;
            font-family: 'Courier Prime', monospace;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--ink-color);
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            font-family: 'Courier Prime', monospace;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--ink-color);
            color: #fff;
            border-color: var(--ink-color);
        }

        .museum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .artifact-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .artifact-card:hover {
            transform: translateY(-3px);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }

        .artifact-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            font-family: 'Courier Prime', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 2px 6px;
            border: 1px solid currentColor;
        }

        .status-active { color: var(--accent-blue); }
        .status-prototype { color: #b8860b; }

        .artifact-title {
            font-family: 'Special Elite', cursive;
            font-size: 1.3rem;
            margin-bottom: 10px;
            padding-right: 60px;
        }

        .artifact-desc {
            font-size: 0.9rem;
            color: var(--meta-color);
            margin-bottom: 15px;
        }

        .artifact-tech {
            font-family: 'Courier Prime', monospace;
            font-size: 0.75rem;
            background: #e6e2d6;
            padding: 4px 8px;
            display: inline-block;
            margin-bottom: 15px;
            border-radius: 2px;
        }

        .artifact-actions {
            display: flex;
            gap: 10px;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
        }

        .artifact-actions a {
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem;
            text-decoration: none;
            color: var(--ink-color);
            background: none;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
        }

        .artifact-actions a:hover {
            background: var(--ink-color);
            color: #fff;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            text-align: center;
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem;
            color: var(--meta-color);
        }

        footer a {
            color: var(--accent-red);
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }

        .loading-msg {
            font-family: 'Courier Prime', monospace;
            font-style: italic;
            color: var(--meta-color);
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="archive-branding">
                <h1>Everything I’ve Ever Made</h1>
                <p>Curated Software Artifacts & Live GitHub Museum [Est. 2026]</p>
            </div>
            <div class="header-links">
                <a href="https://github.com/CalcSolver" target="_blank">View GitHub Profile ↗</a>
            </div>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search archive artifacts by name, keyword, or tech..." onkeyup="filterArtifacts()">
            <button class="filter-btn active" onclick="setFilter('all', this)">All Artifacts</button>
            <button class="filter-btn" onclick="setFilter('active', this)">Active / Primary</button>
            <button class="filter-btn" onclick="setFilter('prototype', this)">Forks / Prototypes</button>
        </div>

        <div class="museum-grid" id="artifactGrid">
            <div class="loading-msg">Accessing GitHub archives... querying live repositories...</div>
        </div>

        <footer>
            <p>Maintained by <a href="https://github.com/CalcSolver" target="_blank">CalcSolver</a>. Powered by live GitHub REST endpoints.</p>
        </footer>
    </div>

    <script>
        let currentFilter = 'all';

        async function fetchGitHubRepos() {
            const grid = document.getElementById('artifactGrid');
            try {
                const response = await fetch('https://api.github.com/users/CalcSolver/repos?sort=updated&per_page=100');
                const repos = await response.json();
                
                if (!Array.isArray(repos)) {
                    throw new Error('API limit or invalid response');
                }

                grid.innerHTML = '';

                repos.forEach(repo => {
                    const status = repo.fork ? 'prototype' : 'active';
                    const tech = repo.language ? repo.language : 'Multi-lang';
                    const desc = repo.description ? repo.description : 'No repository description cataloged yet.';
                    
                    const card = document.createElement('div');
                    card.className = 'artifact-card';
                    card.setAttribute('data-status', status);
                    card.setAttribute('data-keywords', `${repo.name.toLowerCase()} ${tech.toLowerCase()} ${desc.toLowerCase()}`);
                    
                    card.innerHTML = `
                        <span class="artifact-tag status-${status}">${status}</span>
                        <div>
                            <h2 class="artifact-title">${repo.name}</h2>
                            <p class="artifact-desc">${desc}</p>
                            <span class="artifact-tech">${tech}</span>
                        </div>
                        <div class="artifact-actions">
                            <a href="${repo.html_url}" target="_blank">Source Code ↗</a>
                            ${repo.homepage ? `<a href="${repo.homepage}" target="_blank">Live Demo ↗</a>` : ''}
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
                filterArtifacts();
            } catch (error) {
                grid.innerHTML = `<div class="loading-msg" style="color: var(--accent-red);">Failed to load repositories live. Please check your network or check <a href="https://github.com/CalcSolver" target="_blank">GitHub directly</a>.</div>`;
            }
        }

        function setFilter(status, buttonElement) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            filterArtifacts();
        }

        function filterArtifacts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.artifact-card');

            cards.forEach(card => {
                const status = card.getAttribute('data-status');
                const keywords = card.getAttribute('data-keywords');
                const title = card.querySelector('.artifact-title').innerText.toLowerCase();
                const desc = card.querySelector('.artifact-desc').innerText.toLowerCase();

                const matchesFilter = (currentFilter === 'all' || status === currentFilter);
                const matchesSearch = (title.includes(query) || desc.includes(query) || keywords.includes(query));

                if (matchesFilter && matchesSearch) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        window.addEventListener('DOMContentLoaded', fetchGitHubRepos);
    </script>
</body>
</html>
